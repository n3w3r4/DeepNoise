name: Draft Windows release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.6'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check version tag
        run: python -c "import os; from version import VERSION; assert os.environ['GITHUB_REF_NAME'] == 'v' + VERSION"
      - run: python -m pip install --require-hashes -r requirements-lock.txt
      - run: python -m ruff check .
      - run: python -m unittest discover -s tests -v
      - run: node tests/test_ui.cjs
      - run: python build.py
      - run: python -c "from pathlib import Path; from scripts.verify_release import verify; from version import VERSION; verify(Path(f'dist/DeepNoise-{VERSION}-win64.zip'))"
      - run: python scripts/package_source.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            dist/DeepNoise-*.zip
            dist/RELEASE_NOTES.md
            dist/SHA256SUMS.txt
          if-no-files-found: error
  draft:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: dist
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/*.zip dist/SHA256SUMS.txt --verify-tag --draft --notes-file dist/RELEASE_NOTES.md
