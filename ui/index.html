<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeepNoise</title>
<link rel="icon" href="icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="wordmark">DeepNoise</div>
  <div class="led-status" id="status" role="status"><span class="led"></span><span data-i18n="status_starting"></span></div>
  <button class="mute-key" id="mute" type="button" data-i18n-title="mute_title">
    <span class="led" id="mute-led"></span><span id="mute-txt" data-i18n="mute"></span><kbd>Ctrl+Alt+M</kbd>
  </button>
</header>

<div class="scope" id="scope">
  <canvas id="scope-canvas" aria-hidden="true"></canvas>
  <div class="scope-state" id="scope-state"></div>
  <div class="scope-read">
    <div><span class="big" id="removed">—</span> <span id="removed-lbl" data-i18n="removed_lbl"></span></div>
    <div class="legend"><span><i style="background:var(--trace-raw)"></i><span data-i18n="legend_mic"></span></span><span><i style="background:var(--trace-clean)"></i><span data-i18n="legend_clean"></span></span></div>
  </div>
</div>

<div class="master">
  <div>
    <div class="title" data-i18n="nc_title"></div>
    <div class="hint" id="nc-hint"></div>
  </div>
  <label class="switch"><input type="checkbox" id="enabled" data-i18n-aria="nc_title"><span></span></label>
</div>

<main>
  <section aria-labelledby="sec-voice">
    <div class="sec-head"><h2 id="sec-voice" data-i18n="sec_voice"></h2><span class="what" data-i18n="sec_voice_what"></span></div>
    <div class="row"><label for="input" data-i18n="lbl_mic"></label><select id="input"></select></div>
    <p class="note warn" id="mic-warn"></p>
    <div class="row"><label for="output" data-i18n="lbl_send"></label><select id="output"></select></div>
    <p class="note show" id="vmic-info"></p>
    <div class="flow hidden" id="voice-apps"></div>
    <div class="row with-switch">
      <label for="monitor" data-i18n="lbl_monitor"></label>
      <select id="monitor"></select>
      <label class="switch"><input type="checkbox" id="monitor-on" data-i18n-aria="aria_monitor"><span></span></label>
    </div>
  </section>

  <section aria-labelledby="sec-spk">
    <div class="sec-head">
      <h2 id="sec-spk" data-i18n="sec_spk"></h2><span class="what" data-i18n="sec_spk_what"></span>
      <label class="switch"><input type="checkbox" id="spk-on" data-i18n-aria="aria_spk"><span></span></label>
    </div>
    <div id="spk-body">
      <div class="row"><label for="spk-input" data-i18n="lbl_spk_in"></label><select id="spk-input"></select></div>
      <div class="row"><label for="spk-output" data-i18n="lbl_spk_out"></label><select id="spk-output"></select></div>
      <div class="minimeter raw"><span data-i18n="meter_in"></span><div class="track"><b id="m-spk-in"></b></div><span id="v-spk-in">—</span></div>
      <div class="minimeter"><span data-i18n="meter_out"></span><div class="track"><b id="m-spk-out"></b></div><span id="v-spk-out">—</span></div>
      <div class="flow hidden" id="spk-apps"></div>
    </div>
    <p class="note" id="spk-info"></p>
  </section>

  <section aria-labelledby="sec-tune">
    <div class="sec-head"><h2 id="sec-tune" data-i18n="sec_tune"></h2></div>
    <div class="faders">
      <div class="fader" data-help="help_level">
        <div class="name" data-i18n="f_level"></div>
        <input type="range" class="v" id="level" min="0" max="100" step="1" data-i18n-aria="f_level">
        <div class="val" id="level-v"></div>
      </div>
      <div class="fader" data-help="help_pf">
        <div class="name" data-i18n="f_pf"></div>
        <input type="range" class="v" id="pf" min="0" max="0.05" step="0.005" data-i18n-aria="f_pf">
        <div class="val" id="pf-v"></div>
      </div>
      <div class="fader" id="gate-fader" data-help="help_gate">
        <div class="name" data-i18n="f_gate"></div>
        <input type="range" class="v" id="gate" min="-70" max="-30" step="1" data-i18n-aria="f_gate">
        <div class="val" id="gate-v"></div>
        <label class="switch"><input type="checkbox" id="gate-on" data-i18n-aria="f_gate"><span></span></label>
      </div>
      <div class="fader" id="hpf-fader" data-help="help_hpf">
        <div class="name" data-i18n="f_hpf"></div>
        <input type="range" class="v" id="hpf" min="60" max="150" step="5" data-i18n-aria="f_hpf">
        <div class="val" id="hpf-v"></div>
        <label class="switch"><input type="checkbox" id="hpf-on" data-i18n-aria="f_hpf"><span></span></label>
      </div>
    </div>
    <div class="fader-help" id="fader-help" data-i18n="help_default"></div>
  </section>

  <section>
    <details id="adv">
      <summary><h2 data-i18n="more"></h2><span class="what" data-i18n="more_what"></span>
        <svg class="chev" width="12" height="12" viewBox="0 0 10 10" aria-hidden="true"><path d="M1 3l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></summary>
      <div class="opt">
        <div class="t"><span data-i18n="aec_t"></span> <span class="s" id="aec-v"></span></div>
        <label class="switch"><input type="checkbox" id="aec" data-i18n-aria="aec_t"><span></span></label>
        <div class="d" data-i18n="aec_d"></div>
      </div>
      <div class="opt">
        <div class="t"><span data-i18n="bvc_t"></span> <span class="s" id="bvc-v"></span></div>
        <label class="switch"><input type="checkbox" id="bvc" data-i18n-aria="bvc_t"><span></span></label>
        <div class="d" data-i18n="bvc_d"></div>
        <div class="extra"><button class="key" id="calibrate" type="button" data-i18n="calibrate"></button></div>
      </div>
      <div class="opt">
        <div class="t"><span data-i18n="lock_t"></span> <span class="s" id="lock-v"></span></div>
        <label class="switch"><input type="checkbox" id="lock-on" data-i18n-aria="lock_t"><span></span></label>
        <div class="d" data-i18n="lock_d"></div>
        <div class="extra"><input type="range" class="h" id="lock" min="10" max="100" step="1" data-i18n-aria="lock_t"></div>
      </div>
      <div class="opt">
        <div class="t" data-i18n="hotkey_t"></div>
        <label class="switch"><input type="checkbox" id="hotkey" data-i18n-aria="hotkey_t"><span></span></label>
        <div class="d" id="hotkey-desc"></div>
      </div>
      <div class="opt">
        <div class="t" data-i18n="autostart_t"></div>
        <label class="switch"><input type="checkbox" id="autostart" data-i18n-aria="autostart_t"><span></span></label>
        <div class="d" data-i18n="autostart_d"></div>
      </div>
      <div class="opt">
        <div class="t"><label for="lang" data-i18n="lang_t"></label></div>
        <select id="lang" style="width:auto">
          <option value="" data-i18n="lang_auto"></option>
          <option value="pt-BR">Português (Brasil)</option>
          <option value="en-US">English (US)</option>
        </select>
      </div>
    </details>
  </section>
</main>

<footer>
  <span data-i18n="footer_engine"></span><span id="xruns"></span>
  <button class="key" id="diag" type="button" data-i18n="diag" data-i18n-title="diag_title"></button>
</footer>

<script src="i18n.js"></script>
<script>
const $ = (id) => document.getElementById(id);
let state = null;
let lastGate = -50, lastHpf = 100, lastLock = 80;
const NONE = "";

async function api(path, body) {
  const r = await fetch(path, body !== undefined ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
  const data = await r.json();
  if (data.devices) render(data);
  return data;
}

function fillSelect(sel, items, current, opts = {}) {
  if (document.activeElement === sel) return;  // don't rebuild a menu the user is using
  sel.innerHTML = "";
  if (opts.placeholder) {
    const o = document.createElement("option"); o.value = NONE; o.textContent = opts.placeholder; sel.appendChild(o);
  }
  if (current && !items.some((d) => d.name === current)) items = [{ name: current, missing: true }, ...items];
  for (const d of items) {
    const o = document.createElement("option");
    o.value = d.name;
    o.textContent = d.name + (d.missing ? t("tag_missing") : opts.tag ? opts.tag(d) : "");
    if (d.name === current) o.selected = true;
    sel.appendChild(o);
  }
}

function setRange(el, value) {
  if (document.activeElement === el && el.matches(":active")) return;  // user is dragging it
  el.value = value;
  el.style.setProperty("--p", ((value - el.min) / (el.max - el.min)) * 100 + "%");
}

function note(el, html) {
  el.innerHTML = html || "";
  el.classList.toggle("show", !!html);
}

const ARROW = '<svg width="16" height="8" viewBox="0 0 16 8" aria-hidden="true"><path d="M0 4h14M11 1l3 3-3 3" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>';
function flow(el, from, apps) {
  el.classList.toggle("hidden", !apps.length);
  el.innerHTML = apps.length ? `<span>${from}</span>${ARROW}` + apps.map((a) => `<span class="app">${a}</span>`).join("") : "";
}

function render(s) {
  state = s;
  const sel = s.selected, st = s.settings;
  const lang = pickLang(st.lang);
  if (lang !== LANG) { LANG = lang; applyStatic(); }
  if (document.activeElement !== $("lang")) $("lang").value = st.lang || "";

  const inputs = [...s.devices.inputs].sort((a, b) => b.raw - a.raw);
  fillSelect($("input"), inputs, sel.input, { tag: (d) => d.raw ? "" : t("tag_virtual") });
  const outs = [...s.devices.outputs].sort((a, b) => b.cable - a.cable);
  fillSelect($("output"), outs, sel.output, { tag: (d) => d.cable ? t("tag_vmic") : "" });
  fillSelect($("monitor"), s.devices.outputs.filter((d) => !d.cable), sel.monitor, { placeholder: t("ph_headset") });
  fillSelect($("spk-input"), [...s.devices.inputs].sort((a, b) => b.cable - a.cable), sel.spk_input, { placeholder: t("ph_cable"), tag: (d) => d.cable ? t("tag_cable") : "" });
  fillSelect($("spk-output"), s.devices.outputs.filter((d) => !d.cable), sel.spk_output, { placeholder: t("ph_headset") });

  $("enabled").checked = st.enabled;
  $("nc-hint").textContent = t(st.enabled ? "nc_on" : "nc_off");
  setRange($("level"), st.level); $("level-v").textContent = Math.round(st.level) + "%";
  setRange($("pf"), st.pf); $("pf-v").textContent = Math.round(st.pf / 0.05 * 100) + "%";
  const gateOn = st.gate !== null; if (gateOn) lastGate = st.gate;
  $("gate-on").checked = gateOn; $("gate").disabled = !gateOn; setRange($("gate"), lastGate);
  $("gate-v").textContent = gateOn ? lastGate + " dB" : t("off");
  $("gate-fader").classList.toggle("off", !gateOn);
  const hpfOn = st.hpf !== null; if (hpfOn) lastHpf = st.hpf;
  $("hpf-on").checked = hpfOn; $("hpf").disabled = !hpfOn; setRange($("hpf"), lastHpf);
  $("hpf-v").textContent = hpfOn ? lastHpf + " Hz" : t("off");
  $("hpf-fader").classList.toggle("off", !hpfOn);
  document.querySelector(".faders").style.opacity = st.enabled ? 1 : .45;

  $("monitor-on").checked = st.monitor; $("monitor").disabled = !st.monitor;
  $("spk-on").checked = st.spk_enabled; $("spk-body").classList.toggle("hidden", !st.spk_enabled);

  $("aec").checked = st.aec; $("aec").disabled = !s.aec_available;
  $("aec-v").textContent = !s.aec_available ? t("aec_unavail") : !st.spk_enabled ? t("aec_needs") : st.aec ? t("aec_on") : "";
  $("bvc").checked = st.bvc; $("bvc").disabled = st.bvc_threshold === null;
  $("bvc-v").textContent = st.bvc_threshold === null ? t("bvc_need_cal") : t("bvc_below", { v: st.bvc_threshold });
  const lockOn = st.lock_mic !== null;
  if (lockOn) lastLock = st.lock_mic; else if (s.mic_volume) lastLock = s.mic_volume[0];
  $("lock-on").checked = lockOn; $("lock").disabled = !lockOn; setRange($("lock"), lastLock);
  $("lock-v").textContent = [lockOn ? t("lock_at", { v: lastLock }) : "", s.mic_volume ? t("lock_now", { v: s.mic_volume[0] }) : ""].filter(Boolean).join(", ");
  $("hotkey").checked = st.hotkey;
  $("autostart").checked = !!s.autostart;
  $("hotkey-desc").textContent = t(s.hotkey_ok === false ? "hotkey_taken" : "hotkey_ok");

  const micIsVirtual = sel.input && !inputs.find((d) => d.name === sel.input)?.raw;
  note($("mic-warn"), micIsVirtual ? t("warn_virtual_mic") : (s.usage.mic || []).includes("krisp") ? t("warn_krisp") : "");
  const cable = s.devices.outputs.some((d) => d.cable && !/hi-fi/i.test(d.name));
  note($("vmic-info"), s.voice_device ? t("vmic_use", { dev: s.voice_device }) : cable ? t("vmic_choose") : t("vmic_install"));
  flow($("voice-apps"), t("flow_voice"), s.usage.voice || []);
  flow($("spk-apps"), t("flow_spk"), s.usage.spk || []);
  const hifi = s.devices.inputs.some((d) => /hi-fi cable output/i.test(d.name));
  note($("spk-info"), !st.spk_enabled ? "" :
    sel.spk_input && /cable output/i.test(sel.spk_input) ? t("spk_use", { dev: sel.spk_input.replace(/Output/i, "Input") }) :
    sel.spk_input ? t("spk_need_cable") : hifi ? t("spk_choose") : t("spk_install"));
  setStatus(s);
}

function setStatus(s) {
  const led = $("status").querySelector(".led"), txt = $("status").querySelector("span:last-child");
  let cls = "", msg = t("st_stopped");
  if (s.status === "erro") { msg = t("st_error"); cls = "amber"; }
  else if (s.status === "aguardando") { msg = t("st_waiting", { dev: (s.waiting_for || t("st_device")).replace(/\s*\(.*\)$/, "") }); cls = "amber"; }
  else if (s.muted) { msg = t("muted"); }
  else if (s.status === "ativo") { msg = t(s.settings.enabled ? "st_live_on" : "st_live_off"); cls = "on"; }
  led.className = "led " + cls; txt.textContent = msg;
  $("status").title = s.error || s.waiting_for || "";
  $("mute").classList.toggle("muted", !!s.muted);
  $("mute-txt").textContent = t(s.muted ? "muted" : "mute");
  $("mute-led").className = "led " + (!s.muted && s.status === "ativo" ? "on" : "");
  $("scope").classList.toggle("dim", !!s.muted || s.status !== "ativo");
  $("scope-state").textContent = s.muted ? t("scope_muted") : s.status === "aguardando" ? t("scope_waiting") : s.status === "erro" ? (s.error || t("st_error")) : "";
}

// ---------- controls ----------
let timer = null, pending = {};
function push(changes) {
  Object.assign(pending, changes);
  clearTimeout(timer);
  timer = setTimeout(() => { const b = pending; pending = {}; api("/api/settings", b); }, 60);
}
const select = (key) => (e) => e.target.value !== NONE && api("/api/select", { [key]: e.target.value });
$("input").onchange = select("input");
$("output").onchange = select("output");
$("monitor").onchange = select("monitor");
$("spk-input").onchange = select("spk_input");
$("spk-output").onchange = select("spk_output");
$("lang").onchange = (e) => api("/api/settings", { lang: e.target.value || null });
const toggle = (id, key) => ($(id).onchange = (e) => api("/api/settings", { [key]: e.target.checked }));
toggle("enabled", "enabled"); toggle("monitor-on", "monitor"); toggle("spk-on", "spk_enabled");
toggle("aec", "aec"); toggle("bvc", "bvc"); toggle("hotkey", "hotkey");
$("mute").onclick = () => api("/api/mute", {});
$("autostart").onchange = (e) => api("/api/settings", { autostart: e.target.checked });
const slide = (id, fmt, key, keep) => ($(id).oninput = (e) => {
  const v = +e.target.value; setRange(e.target, v); $(id + "-v").textContent = fmt(v); if (keep) keep(v); push({ [key]: v });
});
slide("level", (v) => v + "%", "level");
slide("pf", (v) => Math.round(v / 0.05 * 100) + "%", "pf");
slide("gate", (v) => v + " dB", "gate", (v) => (lastGate = v));
slide("hpf", (v) => v + " Hz", "hpf", (v) => (lastHpf = v));
$("lock").oninput = (e) => { lastLock = +e.target.value; setRange(e.target, lastLock); $("lock-v").textContent = t("lock_at", { v: lastLock }); push({ lock_mic: lastLock }); };
$("gate-on").onchange = (e) => api("/api/settings", { gate: e.target.checked ? lastGate : null });
$("hpf-on").onchange = (e) => api("/api/settings", { hpf: e.target.checked ? lastHpf : null });
$("lock-on").onchange = (e) => api("/api/settings", { lock_mic: e.target.checked ? lastLock : null });
for (const f of document.querySelectorAll(".fader")) {
  const show = () => ($("fader-help").textContent = t(f.dataset.help));
  f.addEventListener("pointerenter", show); f.addEventListener("focusin", show);
}
$("calibrate").onclick = async () => {
  const b = $("calibrate"); b.disabled = true;
  const req = api("/api/calibrate", {});  // server listens for 5 s
  for (let i = 5; i > 0; i--) { b.textContent = t("cal_count", { n: i }); await new Promise((r) => setTimeout(r, 1000)); }
  b.textContent = t("cal_working");
  const res = await req;
  b.textContent = res.calibration ? t("cal_done", { v: res.calibration.voice_db }) : t(res.error === "no_speech" ? "cal_nospeech" : "cal_fail");
  setTimeout(() => { b.disabled = false; b.textContent = t("calibrate"); }, 3500);
};
$("diag").onclick = async () => {
  const b = $("diag"); b.disabled = true; b.textContent = t("diag_saving");
  try { await fetch("/api/diag", { method: "POST" }); b.textContent = t("diag_saved"); } catch { b.textContent = t("diag_fail"); }
  setTimeout(() => { b.disabled = false; b.textContent = t("diag"); }, 2500);
};
try { if (localStorage.getItem("adv") === "1") $("adv").open = true; } catch {}
$("adv").ontoggle = () => { try { localStorage.setItem("adv", $("adv").open ? "1" : "0"); } catch {} };

// ---------- scope: raw mic envelope (grey) under the clean voice (white); the grey left over is the removed noise ----------
const N = 160;  // 8 s at 20 Hz
const hist = { raw: new Float32Array(N).fill(-120), clean: new Float32Array(N).fill(-120) };
const canvas = $("scope-canvas"), ctx = canvas.getContext("2d");
let dirty = true;
const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
function draw() {
  const dpr = window.devicePixelRatio || 1, w = canvas.clientWidth, h = canvas.clientHeight;
  if (canvas.width !== Math.round(w * dpr)) { canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr); }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  const mid = h / 2, amp = h * 0.47;
  ctx.strokeStyle = "rgba(255,255,255,.07)"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, mid + .5); ctx.lineTo(w, mid + .5); ctx.stroke();
  const a = (d) => Math.pow(Math.max(0, Math.min(1, (d + 75) / 75)), 1.6) * amp;
  const band = (arr, color) => {
    ctx.fillStyle = color; ctx.beginPath();
    for (let i = 0; i < N; i++) ctx.lineTo((i / (N - 1)) * w, mid - a(arr[i]));
    for (let i = N - 1; i >= 0; i--) ctx.lineTo((i / (N - 1)) * w, mid + a(arr[i]));
    ctx.closePath(); ctx.fill();
  };
  band(hist.raw, css("--trace-raw"));
  band(hist.clean, css("--trace-clean"));
}
(function frame() { if (dirty) { draw(); dirty = false; } requestAnimationFrame(frame); })();
window.addEventListener("resize", () => (dirty = true));

const removed = [];
const pct = (d) => Math.max(0, Math.min(100, (d + 70) / 70 * 100));
const mini = (bar, val, d, on) => { $(bar).style.width = (on ? pct(d) : 0) + "%"; $(val).textContent = on ? Math.round(d) + " dB" : "—"; };
function listenMeters() {
  const es = new EventSource("/api/meters");
  es.onmessage = (ev) => {
    const m = JSON.parse(ev.data);
    hist.raw.copyWithin(0, 1); hist.clean.copyWithin(0, 1);
    hist.raw[N - 1] = m.running ? m.in_db : -120;
    hist.clean[N - 1] = m.running && !m.muted ? m.out_db : -120;
    dirty = true;
    if (m.running && m.in_db > -85) { removed.push(Math.max(0, m.in_db - m.out_db)); if (removed.length > 40) removed.shift(); }
    if (!m.running || m.muted) { $("removed").textContent = "—"; $("removed-lbl").textContent = t("removed_lbl"); }
    else if (m.in_db <= -85) { $("removed").textContent = t("silence"); $("removed-lbl").textContent = t("silence_lbl"); }
    else if (removed.length) {
      $("removed").textContent = Math.round(removed.reduce((x, y) => x + y, 0) / removed.length) + " dB";
      $("removed-lbl").textContent = t("removed_lbl");
    }
    mini("m-spk-in", "v-spk-in", m.spk_in_db, m.running);
    mini("m-spk-out", "v-spk-out", m.spk_out_db, m.running);
    $("xruns").textContent = m.xruns ? t(m.xruns === 1 ? "xrun_one" : "xrun_many", { n: m.xruns }) : "";
    if (state && (m.status !== state.status || m.muted !== state.muted)) {
      const changed = m.status !== state.status;
      Object.assign(state, { status: m.status, muted: m.muted, running: m.running, waiting_for: m.waiting_for });
      setStatus(state);
      if (changed) api("/api/state");  // device list may have changed (reconnect)
    }
  };
  es.onerror = () => { es.close(); setTimeout(listenMeters, 1000); };
}
LANG = pickLang(null); applyStatic();  // until the saved setting arrives
setInterval(() => api("/api/state"), 4000);  // app usage, device list, mic volume
api("/api/state").then(listenMeters);
</script>
</body>
</html>
